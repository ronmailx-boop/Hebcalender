<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>לוח החגים</title>
    <meta name="description" content="לוח שנה עברי לישראל — כניסת ויציאת שבת וחג, עם צבע ייחודי לכל חג" />
    <link rel="icon" href="/icons/favicon-32.png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://hebcalendar.vplusstudio.app/" />
    <meta property="og:title" content="לוח החגים" />
    <meta property="og:description" content="לוח שנה עברי לישראל — כניסת ויציאת שבת וחג, עם צבע ייחודי לכל חג" />
    <meta property="og:image" content="https://hebcalendar.vplusstudio.app/icons/icon-512.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="לוח החגים" />
    <meta name="twitter:description" content="לוח שנה עברי לישראל — כניסת ויציאת שבת וחג, עם צבע ייחודי לכל חג" />
    <meta name="twitter:image" content="https://hebcalendar.vplusstudio.app/icons/icon-512.png" />
    <link rel="stylesheet" href="/src/styles/tokens.css" />
    <link rel="stylesheet" href="/src/styles/base.css" />
    <link rel="stylesheet" href="/src/styles/legend.css" />
    <link rel="stylesheet" href="/src/styles/grid.css" />
    <link rel="stylesheet" href="/src/styles/detail-panel.css" />
  </head>
  <body>
    <div class="page">
      <div class="legend" role="note" aria-label="הסבר לסימונים">
        <span class="legend-item">לכל חג ולשבת צבע משלו — הקש/י על יום לפרטים</span>
        <span class="legend-item legend-time">🕯️ כניסה &nbsp;·&nbsp; ✨ יציאה</span>
      </div>

      <nav class="month-nav" aria-label="ניווט חודשים">
        <button type="button" id="prevMonth" class="nav-btn" aria-label="חודש קודם">‹</button>
        <h2 id="monthTitle" class="month-title" aria-live="polite"></h2>
        <button type="button" id="nextMonth" class="nav-btn" aria-label="חודש הבא">›</button>
        <button type="button" id="todayBtn" class="today-btn">היום</button>
      </nav>

      <div class="dow-row" id="dowRow" aria-hidden="true"></div>
      <div class="compact-grid" id="compactGrid" role="group" aria-label="רשת ימי החודש"></div>

      <section class="detail-panel" id="detailPanel" aria-live="polite"></section>

      <footer class="foot">
        <p>זמני כניסה/יציאה מחושבים עבור ירושלים (הדלקת נרות 40 דקות לפני השקיעה). תאריכים לפי כללי החגים בישראל.</p>
      </footer>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
